name: Build TOTO GO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore for debugConfig signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from repository debug.keystore.base64..."
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::Neither debug.keystore.base64 nor DEBUG_KEYSTORE_BASE64 was found. Generating a CI debug.keystore for debugConfig."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "NOTE: Add the SHA-1 / SHA-256 below to Firebase Console -> Project Settings for Google Sign-In."
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare and validate app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json! Download google-services.json from Firebase Console (package: com.aistudio.totogo.cpwbxr) and either add GitHub Secret GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64), or place it at app/google-services.json in a private repo."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          pkg = "com.aistudio.totogo.cpwbxr"
          matching = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg
          ]
          if not matching:
              print(f"::error::app/google-services.json does not contain package_name '{pkg}'.", file=sys.stderr)
              sys.exit(1)
          has_web_client = any(
              oauth.get("client_type") == 3
              for c in matching
              for oauth in c.get("oauth_client", [])
          )
          if not has_web_client:
              print("::warning::No client_type 3 Web OAuth client found in app/google-services.json; default_web_client_id may not be generated. Enable Google Sign-In in Firebase Authentication and re-download google-services.json.", file=sys.stderr)
          print(f"Verified app/google-services.json for {pkg} (web_client_present={has_web_client}).")
          PY

      - name: Prepare .env if missing
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify Google Services default_web_client_id generation
        run: |
          if ! grep -rq "default_web_client_id" app/build/generated/res/processDebugGoogleServices/; then
            echo "::error::Google Services plugin did not generate default_web_client_id. Verify Google Sign-In is enabled in Firebase Authentication and re-download app/google-services.json."
            exit 1
          fi
          echo "Verified default_web_client_id generated by google-services plugin."

      - name: Copy APK with clean name
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/TOTO-GO.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOTO-GO-APK
          path: dist-apk/TOTO-GO.apk

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk dist-apk/TOTO-GO.apk --clobber
          else
            gh release create latest-apk dist-apk/TOTO-GO.apk \
              --title "TOTO GO Android APK" \
              --notes "Direct installable Android APK built automatically from source."
          fi
